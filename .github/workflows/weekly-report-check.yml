name: Weekly report quota check

on:
  # Reset hebdomadaire planifie par le Worker Cloudflare (cron), pas par GitHub.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run weekly report check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OFFICER_ROLE_ID: ${{ secrets.DISCORD_OFFICER_ROLE_ID }}
        run: node .github/scripts/weekly-report-check.mjs
