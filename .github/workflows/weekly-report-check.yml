name: Weekly report quota check

on:
  schedule:
    # Tous les lundis a 07:00 UTC (~08-09h en France selon heure d'ete/hiver)
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run weekly report check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OFFICER_ROLE_ID: ${{ secrets.DISCORD_OFFICER_ROLE_ID }}
        run: node .github/scripts/weekly-report-check.mjs
