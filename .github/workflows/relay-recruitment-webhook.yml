name: Relais recrutement vers Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relay pending interviews
        env:
          DISCORD_RECRUITMENT_WEBHOOK_URL: ${{ secrets.DISCORD_RECRUITMENT_WEBHOOK_URL }}
        run: node .github/scripts/relay-recruitment-webhook.mjs
